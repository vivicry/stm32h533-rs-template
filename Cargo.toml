[package]
name = "stm32h533-rs-template"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
cortex-m-semihosting = "0.6.0"
critical-section = "1.2.0"
defmt = "1.2.0"
panic-semihosting = "0.7.0"
stm32h5 = { version = "0.16.0", features = ["rt", "stm32h533"] }
vcell = "0.1.3"
